name: Verify generated MAVLink headers
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m pip install future lxml
      - name: Regenerate from recorded XML commit
        run: python3 generate.py "$(python3 -c 'import json; print(json.load(open("source.json"))["revision"])')"
      - name: Reject manually edited or stale generated files
        run: |
          git diff --exit-code -- mavlink wire source.json
          test -z "$(git ls-files --others --exclude-standard -- mavlink wire)"
